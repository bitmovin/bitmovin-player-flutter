name: Build workspace
on:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
env:
  LC_ALL: en_US.UTF-8
  LANG: en_US.UTF-8
jobs:
  analyze_source_code:
    name: Analyze Source Code
    runs-on: macos-26
    concurrency:
      group: build-workspace-analyze-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare-dependencies
      - name: Analyze Dart
        run: flutter analyze
      - name: Analyze Dart in player_testing
        run: (cd player_testing && dart analyze)
      - name: Analyze Kotlin
        run: ktlint
      - name: Analyze Swift
        run: ./scripts/lint_swift.sh
      - name: Check Dart format
        run: dart format --output=none --set-exit-if-changed .
  build_ios:
    name: Build for iOS
    runs-on: macos-26
    concurrency:
      group: build-workspace-ios-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: bitmovin_player
    steps:
      - uses: actions/checkout@v4
        with:
          path: bitmovin_player
      - uses: ./bitmovin_player/.github/actions/prepare-dependencies
        with:
          working-directory: bitmovin_player
      - name: Build
        run: cd example && flutter build ios --no-codesign
      - name: Verify Bitmovin resolves through SPM
        run: python3 scripts/check_ios_spm.py
  build_android:
    name: Build for Android
    runs-on: ubuntu-latest
    concurrency:
      group: build-workspace-android-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare-dependencies
      - uses: actions/setup-java@v4
        with:
            distribution: 'zulu'
            java-version: '17'
      - name: Build
        run: cd example && flutter build apk

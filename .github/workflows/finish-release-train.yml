name: Finish Release Train

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: finish-release-train-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  tag_approved_release:
    name: Tag the exact human-approved merged release
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Never resolve main or the release branch again after approval.
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          ssh-key: ${{ secrets.PLAYER_FLUTTER_DEPLOY_KEY }}

      - name: Validate merged PR, package, changelog and existing tag
        id: release
        run: python3 .github/scripts/release_train.py finish

      - name: Tag and trigger publication using the deploy key
        if: steps.release.outputs.create_tag == 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          git tag "$RELEASE_VERSION" HEAD
          git push origin "refs/tags/$RELEASE_VERSION"

      - name: Summarize release
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          CREATE_TAG: ${{ steps.release.outputs.create_tag }}
        run: |
          if [ "$CREATE_TAG" = true ]; then
            echo "Tagged the approved merged revision as $RELEASE_VERSION. The tag triggers package, release and documentation publication." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Skipped: $RELEASE_VERSION already tags the approved merged revision. No duplicate publication was triggered." >> "$GITHUB_STEP_SUMMARY"
          fi

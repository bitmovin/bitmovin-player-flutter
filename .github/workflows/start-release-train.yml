name: Start Release Train

on:
  workflow_dispatch:
    inputs:
      version_number:
        description: 'Stable version to prepare for human review and merge'
        type: string
        required: true

env:
  LC_ALL: en_US.UTF-8
  LANG: en_US.UTF-8

permissions:
  contents: read

concurrency:
  group: start-release-train
  cancel-in-progress: false

jobs:
  prepare_release:
    name: Prepare release PR into main
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: bitmovin_player
    env:
      RELEASE_VERSION: ${{ inputs.version_number }}
      # A PAT is needed so the pushed branch and created PR trigger normal CI.
      GH_TOKEN: ${{ secrets.PLAYER_CI_GH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          path: bitmovin_player
          token: ${{ secrets.PLAYER_CI_GH_TOKEN }}

      - name: Validate version and guard existing release work
        id: guard
        run: python3 .github/scripts/release_train.py check-start "$RELEASE_VERSION"

      - uses: ./bitmovin_player/.github/actions/prepare-dependencies
        if: steps.guard.outputs.prepare == 'true'
        with:
          working-directory: bitmovin_player

      - name: Prepare version and dated changelog with empty Unreleased
        if: steps.guard.outputs.prepare == 'true'
        env:
          RELEASE_BRANCH: ${{ steps.guard.outputs.branch }}
        run: |
          git switch -c "$RELEASE_BRANCH"
          python3 .github/scripts/release_train.py prepare "$RELEASE_VERSION"

      - name: Upgrade dependencies and validate the final candidate with SPM
        if: steps.guard.outputs.prepare == 'true'
        run: sh scripts/pre_release_checks.sh --apply-upgrades

      - name: Commit only release contents and push without replacing existing work
        if: steps.guard.outputs.prepare == 'true'
        env:
          RELEASE_BRANCH: ${{ steps.guard.outputs.branch }}
        run: |
          git config user.name "Bitmovin Release Automation"
          git config user.email "player-sdks@bitmovin.com"
          git add -u -- CHANGELOG.md pubspec.yaml example/pubspec.yaml example/pubspec.lock player_testing/pubspec.yaml example/ios/Podfile.lock lib/src player_testing/lib
          git commit --no-verify -m "Prepare release $RELEASE_VERSION for review"
          git push origin "HEAD:refs/heads/$RELEASE_BRANCH"

      - name: Open release approval PR
        if: steps.guard.outputs.prepare == 'true'
        env:
          RELEASE_BRANCH: ${{ steps.guard.outputs.branch }}
        run: |
          cat > "$RUNNER_TEMP/release-pr.md" <<EOF
          ## Description

          Prepare release $RELEASE_VERSION with dependency upgrades, the package version and dated release notes.

          **Merging this PR into main approves automatic publication to pub.dev, creation of the GitHub release and API documentation.** Review the dependency changes and release notes, and wait for the required checks before merging.

          ## Changes

          - The release uses this PR's exact merged commit, with an empty Unreleased section already restored for subsequent changes
          - The changelog date records preparation; no post-publication cleanup PR is required

          ## Checklist (for PR submitters and reviewers)

          - [ ] Release version and changelog reviewed
          - [ ] Dependency upgrades reviewed
          - [ ] Required checks completed for the candidate revision
          EOF
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$RELEASE_BRANCH" --title "Release $RELEASE_VERSION" --body-file "$RUNNER_TEMP/release-pr.md"

      - name: Summarize preparation
        env:
          PREPARED: ${{ steps.guard.outputs.prepare }}
        run: |
          if [ "$PREPARED" = true ]; then
            echo "Release $RELEASE_VERSION prepared. Human merge of its PR approves automatic publication." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Skipped: release $RELEASE_VERSION already has a PR. Existing review work was preserved." >> "$GITHUB_STEP_SUMMARY"
          fi

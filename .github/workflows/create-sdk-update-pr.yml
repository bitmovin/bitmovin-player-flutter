name: Create SDK update PR

run-name: Create SDK update PR for ${{ inputs.sdk_name == 'ios' && 'iOS' || inputs.sdk_name }} player to ${{ inputs.version_number }}

on:
  workflow_dispatch:
    inputs:
      sdk_name:
        description: 'The SDK for which the version should be updated'
        required: true
        type: choice
        options:
          - android
          - ios
      version_number:
        description: 'The version number to which the SDK should be updated'
        required: true
        type: string

jobs:
  update:
    name: Update SDK version
    runs-on: macos-26
    env:
      GH_TOKEN: ${{ secrets.PLAYER_CI_GH_TOKEN }}
    defaults:
      run:
        working-directory: bitmovin_player
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: bitmovin_player

      - name: Setup git user
        run: |
          git config --global user.name "Update Bot"
          git config --global user.email "update-bot@bitmovin.com"

      - name: Set update branch name
        id: branching
        run: |
          branch_name="update_${{ inputs.sdk_name }}_player_to_${{ inputs.version_number }}"
          echo "branch_name=$branch_name" >> "$GITHUB_OUTPUT"

      - name: Create update branch
        run: |
          git push origin --delete ${{ steps.branching.outputs.branch_name }} || true
          git checkout -b ${{ steps.branching.outputs.branch_name }}

      - uses: ./bitmovin_player/.github/actions/prepare-dependencies
        with:
          working-directory: bitmovin_player

      - name: Bump iOS player SDK version
        if: ${{ inputs.sdk_name == 'ios' }}
        env:
          IOS_PLAYER_VERSION: ${{ inputs.version_number }}
        run: |
          python3 scripts/ios_sdk_version.py "$IOS_PLAYER_VERSION"
          (cd example && flutter build ios --no-codesign)

      - name: Bump Android player SDK version
        if: ${{ inputs.sdk_name == 'android' }}
        run: |
          sed -i '' "s/com.bitmovin.player:player:.*/com.bitmovin.player:player:${{ inputs.version_number }}'/g" android/build.gradle

      - name: Update Changelog entry
        run: python3 .github/scripts/update_player_sdk_update_changelog.py ${{ inputs.version_number }} ${{ inputs.sdk_name }}

      - name: Commit version bump
        run: |
          git add ios/bitmovin_player/Package.swift android/build.gradle CHANGELOG.md
          if [ "${{ inputs.sdk_name }}" = "ios" ]; then
            git add example/ios/Podfile.lock example/ios/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved example/ios/Runner.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          fi
          git commit --no-verify -m "chore(${{ inputs.sdk_name }}): update ${{ inputs.sdk_name }} player version to ${{ inputs.version_number }}"
          git push origin ${{ steps.branching.outputs.branch_name }}

      - name: Create PR
        run: |
          gh pr create \
          --base "${{ github.ref }}" \
          --title "Update ${{ inputs.sdk_name == 'ios' && 'iOS' || inputs.sdk_name }} player to ${{ inputs.version_number }}" \
          --body "Automated ${{ inputs.sdk_name == 'ios' && 'iOS' || inputs.sdk_name }} player version update to ${{ inputs.version_number }}"

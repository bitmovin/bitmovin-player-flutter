name: Create SDK update PR

run-name: Create SDK update PR for ${{ inputs.sdk_name == 'ios' && 'iOS' || inputs.sdk_name }} player to ${{ inputs.version_number }}

on:
  workflow_dispatch:
    inputs:
      sdk_name:
        description: 'The SDK for which the version should be updated'
        required: true
        type: choice
        options:
          - android
          - ios
      version_number:
        description: 'The version number to which the SDK should be updated'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.sdk_name }}
  cancel-in-progress: false

jobs:
  update:
    name: Update SDK version
    runs-on: macos-26
    if: ${{ github.ref_type == 'branch' }}
    env:
      GH_TOKEN: ${{ secrets.PLAYER_CI_GH_TOKEN }}
      SDK_PLATFORM: ${{ inputs.sdk_name }}
      SDK_VERSION: ${{ inputs.version_number }}
      SDK_BASE: ${{ github.ref_name }}
      SDK_REPOSITORY: ${{ github.repository }}
    defaults:
      run:
        working-directory: bitmovin_player
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: bitmovin_player
          fetch-depth: 0
          # Reused PRs need checks on pushes as well as initial PR creation.
          token: ${{ secrets.PLAYER_CI_GH_TOKEN }}

      - name: Setup git user
        run: |
          git config --global user.name "Update Bot"
          git config --global user.email "update-bot@bitmovin.com"

      - name: Prepare safe update branch
        run: |
          # Keep the current helper available when reusing an older update branch.
          cp .github/scripts/sdk_update_pr.py "$RUNNER_TEMP/sdk_update_pr.py"
          cp .github/scripts/update_player_sdk_update_changelog.py "$RUNNER_TEMP/update_player_sdk_update_changelog.py"
          python3 "$RUNNER_TEMP/sdk_update_pr.py" prepare "$SDK_PLATFORM" "$SDK_VERSION" "$SDK_BASE" "$SDK_REPOSITORY"

      - uses: ./bitmovin_player/.github/actions/prepare-dependencies
        with:
          working-directory: bitmovin_player

      - name: Bump iOS player SDK version
        if: ${{ inputs.sdk_name == 'ios' }}
        run: |
          python3 scripts/ios_sdk_version.py "$SDK_VERSION"
          (cd example && flutter build ios --no-codesign)
          python3 scripts/check_ios_spm.py

      - name: Bump Android player SDK version
        if: ${{ inputs.sdk_name == 'android' }}
        run: |
          sed -i '' "s/com.bitmovin.player:player:.*/com.bitmovin.player:player:${SDK_VERSION}'/g" android/build.gradle

      - name: Update Changelog entry
        run: python3 "$RUNNER_TEMP/update_player_sdk_update_changelog.py" "$SDK_VERSION" "$SDK_PLATFORM"

      - name: Publish or reuse PR and close superseded updates
        run: |
          python3 "$RUNNER_TEMP/sdk_update_pr.py" finish "$SDK_PLATFORM" "$SDK_VERSION" "$SDK_BASE" "$SDK_REPOSITORY"
